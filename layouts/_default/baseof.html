<!DOCTYPE html>
<html lang="id">

    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <nav class="container nav-bar">
        <a href="/" class="logo">Home</a>

    <footer class="container footer">

    </footer>

</body>

</html>
