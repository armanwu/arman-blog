{{ define "main" }}
<section class="intro">
    <h1>Essays</h1>
    <p>Essays and notes on architecture, computation, and design cognition.</p>
</section>
<div class="post-feed">
    {{ range .Pages }}
    <article class="post-preview">
        <span class="meta-date">{{ .Date.Format "Jan 2, 2006" }} · {{ .ReadingTime }} min read</span>
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        <p class="summary">{{ .Summary | truncate 160 }}</p>
    </article>
    {{ end }}
</div>
{{ end }}
