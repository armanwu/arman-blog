{{ define "main" }}
<article class="full-article">

    <header class="article-header">
        {{ if .Section }}
        <div class="post-meta-tags" style="margin-bottom: 14px;">
            <span class="article-tag">{{ .Section | humanize }}</span>
            {{ with .Params.tools }}
            <span class="category-pill tag-sky">{{ . }}</span>
            {{ end }}
        </div>
        {{ end }}
        <h1>{{ .Title }}</h1>
    </header>

    <div class="article-content">
        {{ .Content }}
    </div>

    <nav class="prev-next">
        {{ with .PrevInSection }}
        <a href="{{ .RelPermalink }}" class="prev-next-card">
            <div class="prev-next-label">← Previous</div>
            <div class="prev-next-title">{{ .Title }}</div>
        </a>
        {{ else }}
        <div></div>
        {{ end }}

        {{ with .NextInSection }}
        <a href="{{ .RelPermalink }}" class="prev-next-card next">
            <div class="prev-next-label">Next →</div>
            <div class="prev-next-title">{{ .Title }}</div>
        </a>
        {{ else }}
        <div></div>
        {{ end }}
    </nav>

</article>
{{ end }}
