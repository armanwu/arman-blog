{{ define "main" }}
<article class="full-article">

    <header class="article-header">
        <span class="article-tag">Essays</span>
        <h1>{{ .Title }}</h1>
        <div class="article-meta-row">
            <img src="/img/avatar.png" alt="Arman Wu" class="article-avatar">
            <span class="article-author">Arman Wu</span>
            <span class="meta-dot"></span>
            <span class="article-date">{{ .Date.Format "Jan 2, 2006" }}</span>
            <span class="meta-dot"></span>
            <span class="article-readtime">{{ .ReadingTime }} min read</span>
        </div>
    </header>

    <div class="article-content">
        {{ .Content }}
    </div>

    <nav class="prev-next">
        {{ with .PrevInSection }}
        <a href="{{ .Permalink }}" class="prev-next-card">
            <div class="prev-next-label">← Previous</div>
            <div class="prev-next-title">{{ .Title }}</div>
        </a>
        {{ else }}
        <div></div>
        {{ end }}

        {{ with .NextInSection }}
        <a href="{{ .Permalink }}" class="prev-next-card next">
            <div class="prev-next-label">Next →</div>
            <div class="prev-next-title">{{ .Title }}</div>
        </a>
        {{ else }}
        <div></div>
        {{ end }}
    </nav>

</article>
{{ end }}
