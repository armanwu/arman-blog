{{ define "main" }}
<section class="intro">
    <h1>{{ .Title }}</h1>
    <div class="content" style="margin-bottom: 20px; color: #757575;">
        {{ .Content }}
    </div>
</section>

<div class="project-grid">
    {{ range .Pages }}
    <a href="{{ .Permalink }}" class="project-card">

        <div class="project-image">
            {{ if .Params.image }}
            <img src="{{ .Params.image }}" alt="{{ .Title }}">
            {{ else }}
            <div style="background: #ddd; width: 100%; height: 100%;"></div>
            {{ end }}
        </div>

        <div class="project-info">
            <h3>{{ .Title }}</h3>
        </div>
    </a>
    {{ end }}
</div>
{{ end }}
