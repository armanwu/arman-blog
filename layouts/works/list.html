{{ define "main" }}
<section class="intro">
    <h1>{{ .Title }}</h1>
    <div class="content">
        {{ .Content }}
    </div>
</section>

<div class="project-grid">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="project-card">

        <div class="project-image">
            {{ if .Params.image }}
            <img src="{{ .Params.image }}" alt="{{ .Title }}" loading="lazy" decoding="async">
            {{ else }}
            <div class="project-image-placeholder">No Image</div>
            {{ end }}
        </div>

        <div class="project-info">
            <h3>{{ .Title }}</h3>
        </div>
    </a>
    {{ end }}
</div>
{{ end }}
